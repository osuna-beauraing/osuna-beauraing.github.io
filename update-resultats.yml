name: Mise à jour des résultats

on:
  schedule:
    # Dimanche 21:00 UTC (~22-23h en Belgique) : après les matchs du week-end.
    - cron: "0 21 * * 0"
    # Lundi 08:00 UTC : rattrapage des scores encodés tard (dimanche soir / lundi matin).
    - cron: "0 8 * * 1"
  workflow_dispatch: {} # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer resultats.json depuis le portail FVWB
        run: node scripts/update-resultats.mjs

      - name: Publier les changements (s'il y en a)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultats.json
          git diff --staged --quiet || git commit -m "Mise à jour automatique des résultats"
          git push
